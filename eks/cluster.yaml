
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: vprofile-eks
  region: ap-southeast-2
  version: "1.36"

autoModeConfig:
  enabled: false

availabilityZones:
  - ap-southeast-2a
  - ap-southeast-2b

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

iam:
  withOIDC: true

managedNodeGroups:
  - name: vprofile-workers
    instanceType: c7i-flex.large
    availabilityZones:
      - ap-southeast-2a
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false
    ssh:
      allow: false
