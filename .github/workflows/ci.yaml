name: CI/CD - VProfile EKS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'kubedefs/**'
      - 'bootstrap/**'
      - 'argocd/**'
      - 'eks/**'
        #- 'README.md'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vprofile-ci-main
  cancel-in-progress: false

jobs:

  build:
    name: Build Maven Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WAR
        run: mvn -B -ntp -DskipTests clean package

  test:
    name: Run Maven Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push VProfile application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Docker-files/app/Dockerfile
          push: true
          tags: |
            docvishnu1/vprofileapp:sha-${{ github.sha }}
            docvishnu1/vprofileapp:latest

      - name: Build and push VProfile database
        uses: docker/build-push-action@v6
        with:
          context: ./Docker-files/db
          file: ./Docker-files/db/Dockerfile
          push: true
          tags: |
            docvishnu1/vprofiledb:bootstrap

  update-helm:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Update application image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i "/^app:/,/^db:/ s|^    tag: .*|    tag: \"$IMAGE_TAG\"|" \
            helm/vprofile-chart/values.yaml

          grep -F "    tag: \"$IMAGE_TAG\"" \
            helm/vprofile-chart/values.yaml

          echo "Updated application tag to $IMAGE_TAG"

      - name: Commit and push Helm change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/vprofile-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm image tag change required."
          else
            git commit -m "ci: update VProfile image to sha-${GITHUB_SHA}"
            git push origin HEAD:main
          fi
