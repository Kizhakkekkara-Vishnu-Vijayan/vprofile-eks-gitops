name: VProfile Docker CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push VProfile application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Docker-files/app/Dockerfile
          push: true
          tags: |
            docvishnu1/vprofileapp:latest
            docvishnu1/vprofileapp:sha-${{ github.sha }}

      - name: Build and push VProfile database
        uses: docker/build-push-action@v6
        with:
          context: ./Docker-files/db
          file: ./Docker-files/db/Dockerfile
          push: true
          tags: |
            docvishnu1/vprofiledb:bootstrap
